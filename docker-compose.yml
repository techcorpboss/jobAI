version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hiremind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hiremind
      POSTGRES_PASSWORD: hiremind_secret_2026
      POSTGRES_DB: hiremind_vn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hiremind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiremind-backend
    restart: unless-stopped
    env_file:
      - .env.example
    ports:
      - "8010:8010"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hiremind-frontend
    restart: unless-stopped
    environment:
      - PORT=3009
    ports:
      - "3009:3009"
    depends_on:
      - backend

volumes:
  pgdata:
