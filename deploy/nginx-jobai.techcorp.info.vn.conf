server {
    listen 80;
    listen 443 ssl http2;
    server_name jobai.techcorp.info.vn;
    index index.html careers.html login.html;
    root /www/wwwroot/jobai.techcorp.info.vn;

    # Force HTTPS Redirect
    if ($server_port !~ 443){
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    # SSL Certificate (aaPanel / Let's Encrypt)
    ssl_certificate    /www/server/panel/vhost/cert/jobai.techcorp.info.vn/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/jobai.techcorp.info.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 30M;

    # FastAPI Backend API Proxy (Port 8010)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Static CV PDFs Proxy (Port 8010)
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8010/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /careers {
        try_files /careers.html =404;
    }
    location = /login {
        try_files /login.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    access_log  /www/wwwlogs/jobai.techcorp.info.vn.log;
    error_log  /www/wwwlogs/jobai.techcorp.info.vn.error.log;
}
