<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            hr: {
              bg: '#F3F6FA',
              card: '#FFFFFF',
              navy: '#0F172A',
              blue: '#1D4ED8',

              border: '#E2E8F0'

          }

    html[lang="ja"] body, html[lang="ja"] input, html[lang="ja"] select, html[lang="ja"] textarea, html[lang="ja"] button {
      font-family: 'Noto Sans JP', 'Yu Gothic', 'Meiryo', 'Be Vietnam Pro', sans-serif;

    html[lang="zh"] body, html[lang="zh"] input, html[lang="zh"] select, html[lang="zh"] textarea, html[lang="zh"] button {

    html.dark body {

      color: #F1F5F9;

    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 9999px; }
    .custom-scroll:hover::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.45); }

    }

      border-color: #CBD5E1;
      box-shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.06);
    }
    html.dark .hr-card {
      background: #111827;
      border-color: #1E293B;
    }
    .sidebar-btn-active {
      background: linear-gradient(90deg, rgba(239, 246, 255, 0.95) 0%, rgba(240, 253, 250, 0.75) 100%);
      color: #1D4ED8 !important;
      box-shadow: inset 3px 0 0 0 #2563EB, 0 1px 2px 0 rgba(15, 23, 42, 0.03);
      font-weight: 700;
    }
    html.dark .sidebar-btn-active {
      background: rgba(37, 99, 235, 0.16);
      color: #60A5FA !important;
      box-shadow: inset 3px 0 0 0 #60A5FA;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
      100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
    .recording-pulse { animation: pulse-ring 1.5s infinite; }
    /* Global Executive Modal Form Upgrade for Admin ATS */
    #crud-modal-content, #candidate-modal-content {
      font-size: 0.925rem !important;
      line-height: 1.65 !important;
    }
    #crud-modal-content .text-xs, #candidate-modal-content .text-xs {
      font-size: 0.88rem !important;
      line-height: 1.6 !important;
    }
    #crud-modal-content h3, #candidate-modal-content h3 {
      font-size: 1.3rem !important;
      line-height: 1.35 !important;
    }
    #crud-modal-content label {
      font-size: 0.875rem !important;
      font-weight: 700 !important;
      margin-bottom: 0.35rem !important;
      display: block;

      font-size: 0.925rem !important;
      border-radius: 0.85rem !important;
      border: 1.5px solid #CBD5E1 !important;

    #crud-modal-content input:focus,
    #crud-modal-content select:focus,
    #crud-modal-content textarea:focus {
      outline: none !important;
      border-color: #2563EB !important;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14) !important;

</head>

              <span class="text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">● LIVE STREAM</span>

            <h3 class="text-base font-extrabold mt-0.5">Trung tâm Thông báo &amp; Tiến trình AI</h3>

        </div>

          <button onclick="markAllNotificationsRead()" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-[11px] font-bold transition">✔ Đã đọc tất cả</button>

          <button onclick="toggleMessengerDrawer(false)" class="w-8 h-8 rounded-xl bg-white/10 hover:bg-white/25 font-extrabold text-sm flex items-center justify-center">✕</button>
        </div>
      </div>

      <div class="px-5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center gap-1.5 text-xs">

        <button onclick="setMessengerFilter('category')" class="px-3 py-1.5 rounded-xl font-bold bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-[11px]">🗂️ Danh mục</button>
      </div>

      <div id="messenger-drawer-body" class="p-5 overflow-y-auto custom-scroll space-y-4 flex-1"></div>
